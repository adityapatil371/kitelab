<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kitelab — levels</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #131722; --panel: #1b2030; --line: #2a3245;
    --text: #d7dae0; --dim: #8892a4; --accent: #4fc3f7;
    --support: #26a69a; --resistance: #ef5350; --breakout: #ffb74d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
           padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  select, button { background: #232a3d; color: var(--text); border: 1px solid var(--line);
                   border-radius: 5px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.armed { background: var(--accent); color: #10131c; font-weight: 600; border-color: var(--accent); }
  .spacer { flex: 1; }
  .hint { color: var(--dim); font-size: 12px; }
  main { flex: 1; display: flex; min-height: 0; }
  #chart { flex: 1; min-width: 0; }
  aside { width: 310px; border-left: 1px solid var(--line); background: var(--panel);
          overflow-y: auto; padding: 12px; }
  aside h2 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase;
             letter-spacing: .08em; color: var(--dim); font-weight: 600; }
  .level { border: 1px solid var(--line); border-left-width: 3px; border-radius: 6px;
           padding: 8px 10px; margin-bottom: 8px; }
  .level.support { border-left-color: var(--support); }
  .level.resistance { border-left-color: var(--resistance); }
  .level.breakout { border-left-color: var(--breakout); }
  .level .price { font-size: 15px; font-weight: 600; }
  .level .meta { color: var(--dim); font-size: 11.5px; margin-top: 3px; }
  .level .warn { color: var(--resistance); }
  .level button { padding: 2px 8px; font-size: 11px; margin-top: 6px; }
  footer { padding: 6px 14px; background: var(--panel); border-top: 1px solid var(--line);
           color: var(--dim); font-size: 11px; }
  footer a { color: var(--dim); }
</style>
</head>
<body>
<header>
  <select id="symbol"></select>
  <select id="timeframe">
    <option value="1d" selected>1 day</option>
    <option value="30m">30 min</option>
    <option value="15m">15 min</option>
    <option value="1h">1 hour</option>
    <option value="1w">1 week</option>
    <option value="1M">1 month</option>
  </select>
  <label class="hint"><input type="checkbox" id="showTrades" checked> EMA trades</label>
  <span class="spacer"></span>
  <select id="kind">
    <option value="support">support</option>
    <option value="resistance">resistance</option>
    <option value="breakout">breakout</option>
  </select>
  <button id="arm">+ Add level</button>
  <span class="hint" id="hint">click “Add level”, then click the chart</span>
</header>
<main>
  <div id="chart"></div>
  <aside>
    <h2>Levels</h2>
    <div id="levels"></div>
    <h2 style="margin-top:16px">EMA Trades <span class="hint" id="tradeCount"></span></h2>
    <div id="trades" class="hint">shown on the 1-day chart</div>
  </aside>
</main>
<footer>
  Charts by <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a>
  — Lightweight Charts™, Apache-2.0. Prices from your own Kite data.
</footer>

<script>
const COLOR = { support: '#26a69a', resistance: '#ef5350', breakout: '#ffb74d' };
const EMA_STYLE = { daily_ema:  { color: '#4fc3f7', title: 'EMA20 D' },
                    weekly_ema: { color: '#ffb74d', title: 'EMA20 W' },
                    monthly_ema:{ color: '#ce93d8', title: 'EMA20 M' } };
const el = id => document.getElementById(id);
let chart, candles, volume, priceLines = [], armed = false, emaSeries = {};

function build() {
  chart = LightweightCharts.createChart(el('chart'), {
    layout: { background: { color: '#131722' }, textColor: '#d7dae0' },
    grid: { vertLines: { color: '#1f2536' }, horzLines: { color: '#1f2536' } },
    rightPriceScale: { borderColor: '#2a3245', scaleMargins: { top: 0.08, bottom: 0.26 } },
    timeScale: { borderColor: '#2a3245', timeVisible: true, secondsVisible: false },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  });
  candles = chart.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
    wickUpColor: '#26a69a', wickDownColor: '#ef5350',
  });
  volume = chart.addHistogramSeries({
    priceFormat: { type: 'volume' }, priceScaleId: 'vol',
  });
  chart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
  for (const [key, style] of Object.entries(EMA_STYLE)) {
    emaSeries[key] = chart.addLineSeries({
      color: style.color, lineWidth: 1, title: style.title,
      priceLineVisible: false, lastValueVisible: false,
      crosshairMarkerVisible: false,
    });
  }

  chart.subscribeClick(param => {
    if (!armed || !param.point) return;
    const price = candles.coordinateToPrice(param.point.y);
    if (price == null) return;
    disarm();
    post('/api/levels', { symbol: el('symbol').value, price, kind: el('kind').value })
      .then(render);
  });
  new ResizeObserver(() => chart.applyOptions({
    width: el('chart').clientWidth, height: el('chart').clientHeight,
  })).observe(el('chart'));
}

const get = url => fetch(url).then(r => r.json());
const post = (url, body) => fetch(url, {
  method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
}).then(r => r.json());

function arm() { armed = true; el('arm').classList.add('armed');
  el('hint').textContent = 'now click the chart at your price'; }
function disarm() { armed = false; el('arm').classList.remove('armed');
  el('hint').textContent = 'click “Add level”, then click the chart'; }

async function loadCandles() {
  const tf = el('timeframe').value;
  const data = await get(`/api/candles?symbol=${el('symbol').value}&tf=${tf}`);
  if (data.error) { alert(data.error); return; }
  candles.setData(data.candles);
  volume.setData(data.volume);
  await loadOverlays(tf);
  chart.timeScale().fitContent();
}

// The EMA trades live on daily bars, so overlays and markers only make sense there.
async function loadOverlays(tf) {
  const on = tf === '1d' && el('showTrades').checked;
  if (!on) {
    Object.values(emaSeries).forEach(s => s.setData([]));
    candles.setMarkers([]);
    el('trades').innerHTML = '<span class="hint">shown on the 1-day chart</span>';
    el('tradeCount').textContent = '';
    return;
  }
  const sym = el('symbol').value;
  const [emas, tr] = await Promise.all([
    get(`/api/ema?symbol=${sym}`), get(`/api/trades?symbol=${sym}`),
  ]);
  for (const key of Object.keys(emaSeries)) emaSeries[key].setData(emas[key] || []);

  const trades = tr.trades || [];
  const markers = [];
  for (const t of trades) {
    const win = t.net > 0;
    markers.push({ time: t.entry, position: 'belowBar', shape: 'arrowUp',
                   color: '#4fc3f7', text: 'B ' + t.entry_price.toFixed(1) });
    markers.push({ time: t.exit, position: 'aboveBar', shape: 'arrowDown',
                   color: win ? '#26a69a' : '#ef5350',
                   text: (win ? '+' : '') + Math.round(t.net) });
  }
  markers.sort((a, b) => a.time < b.time ? -1 : 1);
  candles.setMarkers(markers);

  el('tradeCount').textContent = `(${trades.length})`;
  const list = el('trades');
  list.innerHTML = '';
  [...trades].reverse().forEach(t => {
    const win = t.net > 0;
    const node = document.createElement('div');
    node.className = 'level';
    node.style.borderLeftColor = win ? '#26a69a' : '#ef5350';
    node.style.cursor = 'pointer';
    node.innerHTML = `
      <div class="price" style="color:${win ? '#26a69a' : '#ef5350'}">${win ? '+' : ''}${Math.round(t.net)}</div>
      <div class="meta">${t.entry} → ${t.exit}</div>
      <div class="meta">in ${t.entry_price.toFixed(2)} · out ${t.exit_price.toFixed(2)} · ${t.reason}</div>`;
    node.onclick = () => {
      const pad = d => { const x = new Date(d); return x; };
      const from = pad(t.entry); from.setDate(from.getDate() - 40);
      const to = pad(t.exit); to.setDate(to.getDate() + 40);
      chart.timeScale().setVisibleRange({
        from: from.toISOString().slice(0, 10), to: to.toISOString().slice(0, 10),
      });
    };
    list.appendChild(node);
  });
}

function render(payload) {
  priceLines.forEach(line => candles.removePriceLine(line));
  priceLines = [];
  const list = el('levels');
  const items = payload.levels || [];
  list.innerHTML = items.length ? '' : '<p class="hint">No levels yet on this symbol.</p>';

  items.forEach(level => {
    priceLines.push(candles.createPriceLine({
      price: level.price, color: COLOR[level.kind], lineWidth: 1,
      lineStyle: LightweightCharts.LineStyle.Dashed,
      axisLabelVisible: true, title: level.kind[0].toUpperCase(),
    }));
    const node = document.createElement('div');
    node.className = `level ${level.kind}`;
    const established = level.valid_from
      ? `valid from ${level.valid_from}`
      : `<span class="warn">only ${level.touches} touch — not a line yet</span>`;
    node.innerHTML = `
      <div class="price">${level.price.toFixed(2)}</div>
      <div class="meta">${level.kind} · ${level.touches} touches</div>
      <div class="meta">${established}</div>
      <button data-index="${level.index}">delete</button>`;
    node.querySelector('button').onclick = () =>
      post('/api/levels/delete', { symbol: el('symbol').value, index: level.index })
        .then(render);
    list.appendChild(node);
  });
}

async function refresh() {
  await loadCandles();
  render(await get(`/api/levels?symbol=${el('symbol').value}`));
}

(async function start() {
  build();
  const { symbols } = await get('/api/symbols');
  el('symbol').innerHTML = symbols.map(s => `<option>${s}</option>`).join('');
  el('symbol').onchange = refresh;
  el('timeframe').onchange = loadCandles;
  el('showTrades').onchange = loadCandles;
  el('arm').onclick = () => (armed ? disarm() : arm());
  await refresh();
})();
</script>
</body>
</html>
